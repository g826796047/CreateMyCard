name: PR Tests

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  python-quality:
    name: Changed Python quality checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: widget_service/requirements.txt

      - name: Install Ruff
        run: python -m pip install "ruff>=0.5.0"

      - name: Check changed Python and whitespace
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            base_sha="${{ github.event.pull_request.base.sha }}"
          else
            base_sha="HEAD^"
          fi
          git diff --check "$base_sha" HEAD
          mapfile -t changed_python < <(git diff --name-only --diff-filter=ACMR "$base_sha" HEAD -- '*.py')
          if (( ${#changed_python[@]} )); then
            python -m ruff check "${changed_python[@]}"
          fi

  widget-service-l0:
    name: L0 widget service
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: widget_service
    env:
      PYTHONUTF8: "1"
      WIDGET_SERVICE_TEST_HOST: "127.0.0.1"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: widget_service/requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run L0 tests
        run: >-
          python -m pytest
          test
          -m l0
          -q -ra
          --junitxml=test-results/l0-widget-service.xml

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: l0-widget-service-results
          path: widget_service/test-results/l0-widget-service.xml
          if-no-files-found: warn

  model-smoke:
    name: Controlled real-model smoke
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: widget_service
    env:
      PYTHONUTF8: "1"
      WIDGET_SERVICE_TEST_HOST: "127.0.0.1"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: widget_service/requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run real-model DSL smoke
        env:
          WIDGET_SERVICE_LOCAL_FLAG: "true"
          WIDGET_SERVICE_DESIGN_COMPACT_MODEL_BACKEND: openai
          WIDGET_SERVICE_OPENAI_MASTER_CLIENT: deepseek_official_http
          WIDGET_SERVICE_ENABLE_OPENAI_FALLBACK: "false"
          WIDGET_SERVICE_DEEPSEEK_OFFICIAL_HTTP_API_KEY: ${{ secrets.WIDGET_SERVICE_DEEPSEEK_OFFICIAL_HTTP_API_KEY }}
        run: python -m pytest test/smoke/compact_dsl_smoke.py -q
