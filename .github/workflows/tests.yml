name: PR Tests

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Widget service tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: widget_service
    env:
      PYTHONUTF8: "1"
      WIDGET_SERVICE_TEST_HOST: "127.0.0.1"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: widget_service/requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: 主服务真实 DSL 生成冒烟
        env:
          WIDGET_SERVICE_LOCAL_FLAG: "true"
          WIDGET_SERVICE_DESIGN_COMPACT_MODEL_BACKEND: openai
          WIDGET_SERVICE_OPENAI_MASTER_CLIENT: deepseek_official_http
          WIDGET_SERVICE_ENABLE_OPENAI_FALLBACK: "false"
          WIDGET_SERVICE_DEEPSEEK_OFFICIAL_HTTP_API_KEY: ${{ secrets.WIDGET_SERVICE_DEEPSEEK_OFFICIAL_HTTP_API_KEY }}
        run: python -m pytest tests/compact_dsl_smoke.py -q

      - name: Run tests
        if: ${{ !cancelled() }}
        run: python -m pytest tests -q -ra --junitxml=test-results/pytest.xml

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: widget-service-test-results
          path: widget_service/test-results/pytest.xml
          if-no-files-found: warn
